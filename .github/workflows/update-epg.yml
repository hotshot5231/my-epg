name: Update and publish EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: epg-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Get iptv-org EPG scraper
        uses: actions/checkout@v4
        with:
          repository: iptv-org/epg
          path: epg-scraper

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install scraper
        run: npm install
        working-directory: epg-scraper

      - name: Generate and validate guide
        run: python build_epg.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publish guide
        id: deployment
        uses: actions/deploy-pages@v4
